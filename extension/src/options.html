<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marintel Options</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
      }
      body {
        margin: 0;
        padding: 24px;
        max-width: 720px;
      }
      h1 {
        margin: 0 0 16px 0;
        font-size: 20px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(127, 127, 127, 0.35);
        font-size: 14px;
      }
      .row {
        display: flex;
        gap: 12px;
        margin-top: 12px;
        align-items: center;
      }
      button {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(127, 127, 127, 0.35);
        background: transparent;
        cursor: pointer;
        font-weight: 600;
      }
      .status {
        margin-top: 12px;
        font-size: 13px;
        opacity: 0.9;
        white-space: pre-wrap;
      }
      .hint {
        margin-top: 10px;
        font-size: 13px;
        opacity: 0.8;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <h1>Marintel Options</h1>
    <label for="backendUrl">Backend base URL</label>
    <input id="backendUrl" placeholder="http://localhost:8787" />
    <div class="row">
      <button id="saveBtn" type="button">Save</button>
      <button id="testBtn" type="button">Test /health</button>
    </div>
    <div class="status" id="status"></div>
    <div class="hint">
      Tip: when you save, Marintel will request a host permission for the backend origin (for example
      <code>http://localhost:8787/*</code>).
    </div>
    <script src="./options.js"></script>
  </body>
</html>
